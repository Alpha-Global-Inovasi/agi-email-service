[package]
name = "cf-email"
version = "0.1.1"
edition = "2024"
description = "Email library for Rust services, with SMTP and mock providers and Handlebars templates"
license = "MIT"
authors = ["Alindra Putra"]
repository = "https://github.com/Crypto-Foundation-Dev/cf-email"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync"] }
async-trait = "0.1"
thiserror = "1.0"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
handlebars = "4.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
